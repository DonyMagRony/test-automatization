name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      shards:
        description: Number of shards
        type: choice
        required: true
        default: '4'
        options: ['1', '4']
      collect_trace:
        description: Record traces for passing tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: cmd
    working-directory: qa-playwright-ts

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://practicesoftwaretesting.com' }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      CI_TRACE: ${{ inputs.collect_trace && 'on' || 'on-first-retry' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa-playwright-ts/package-lock.json

      - name: Check required secret
        shell: cmd
        run: |
          node -e "if (!process.env.TEST_PASSWORD || !process.env.TEST_PASSWORD.trim()) { console.error('::error::Create the repository Actions secret TEST_PASSWORD.'); process.exit(1); } console.log('TEST_PASSWORD is configured.');"

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: qa-playwright-ts/blob-report/
          retention-days: 1
          if-no-files-found: error

      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            qa-playwright-ts/test-results/
            qa-playwright-ts/reports/
          retention-days: 14
          if-no-files-found: warn

  merge-reports:
    name: Merge reports
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        shell: bash
        working-directory: qa-playwright-ts

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa-playwright-ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: qa-playwright-ts/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML and JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-playwright-ts/playwright-report/
          retention-days: 14
          if-no-files-found: error

      - name: Upload merged JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: qa-playwright-ts/reports/junit-merged.xml
          retention-days: 14
          if-no-files-found: error