name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: qa-playwright-ts

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa-playwright-ts/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Check target application
        run: |
          echo "BASE_URL: $BASE_URL"
          echo "Checking application..."

          curl -IL --max-time 20 "$BASE_URL"

          echo "Checking response body..."
          curl -Ls --max-time 20 "$BASE_URL" | head -c 1000
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: qa-playwright-ts/blob-report
          retention-days: 1
      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            qa-playwright-ts/test-results/
            qa-playwright-ts/reports/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa-playwright-ts/package-lock.json
      - run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: qa-playwright-ts/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML + JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-playwright-ts/playwright-report
          retention-days: 14
      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: qa-playwright-ts/reports/junit-merged.xml
          retention-days: 14
